app:
  name: "ForensicAI Lab"
  version: "0.1.0"
  cors_allow_origins: ["*"]

api:
  base_url: "http://localhost:8000"

inference:
  runtime: "onnxruntime"
  execution_provider: "CPUExecutionProvider"
  image_size: [256, 256]
  input_channels: 5 # RGB(3) + ELA(1) + FFT(1)
  mask_threshold: 0.5
  input_name: "input"
  output_names: ["cls_logits", "manip_logits", "mask_logits", "feature_map"]

models:
  image_model_onnx_path: "models/image_model.onnx"
  video_model_onnx_path: "models/video_model.onnx"
  final_model_onnx_path: "models/final_model.onnx"
  # Training-side (.pth) checkpoints, used only by export_onnx.py / notebooks.
  image_model_checkpoint: "models/image_model.pth"
  video_model_checkpoint: "models/video_model.pth"
  final_model_checkpoint: "models/final_model.pth"
  backbone: "efficientnet_b0"
  # timm adapts the pretrained 3-channel first-conv weights to in_chans=5
  # automatically (sums/repeats the RGB filters) -- no custom code needed.
  # Was false for every training notebook until now: none of them actually
  # passed `pretrained=` through to ForensicMultiHeadNet, so every run so
  # far trained EfficientNet-B0 from random init regardless of this value,
  # which is very likely the dominant reason results stayed near chance
  # even after fixing sampling/loss weighting and adding face-cropping --
  # a from-scratch CNN needs far more data than these datasets provide.
  pretrained_encoder: true

# Pretrained "second opinion" image model (TensorFold/detectra-v1, ViT-S/16@384,
# MIT, zero-training). Own preprocessing path, separate from the 5-channel
# RGB+ELA+FFT pipeline the custom model uses. Preprocessing/threshold/sha256
# taken directly from the model card (huggingface.co/TensorFold/detectra-v1),
# not guessed: shortest-edge resize -> center-crop -> ImageNet normalize ->
# sigmoid(logit) compared against the model's own reported 0.65 operating
# threshold (not an arbitrary 0.5).
ensemble:
  model_onnx_path: "models/ensemble/detectra_v1.onnx"
  input_name: "pixel_values"
  output_name: "logit"
  resize_shortest_edge: 440
  crop_size: [384, 384]
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
  ai_generated_threshold: 0.65

# Audio deepfake/voice-clone detection (ai8shiro/deepfake-audio-wav2vec2-ONNX,
# wav2vec2-base + linear head, MIT, zero-training). Own modality, own binary
# schema -- not folded into the image/video manipulation-type taxonomy.
audio:
  model_onnx_path: "models/audio/wav2vec2_deepfake.onnx"
  input_name: "input_values"
  output_name: "logits"
  sample_rate: 16000
  id2label:
    0: "real"
    1: "fake"

# Retrieval-only RAG explanations (onnx-community/all-MiniLM-L6-v2-ONNX).
# Pure retrieval, no generative LLM call -- zero hallucination risk, replaces
# predictor.py's old hardcoded _EXPLANATIONS dict lookup with a cosine-
# similarity match against a small curated knowledge base.
rag:
  embedder_onnx_path: "models/rag/minilm.onnx"
  tokenizer_path: "models/rag/tokenizer.json"
  knowledge_base_path: "data/knowledge_base/forgery_techniques.json"
  embeddings_path: "data/knowledge_base/embeddings.npy"
  max_seq_length: 128
  hidden_size: 384

labels:
  binary: ["real", "fake"]
  manipulation_types:
    ["copy_move", "splicing", "inpainting", "gan", "compression", "beautify"]
  manipulation_type_none: "none"

video:
  sample_fps: 2.0
  fake_frame_ratio_threshold: 0.30
  max_frames_to_process: 150

playground:
  default_patch_size: [64, 64]
  default_jpeg_quality: 20
  default_blur_ksize: 15
  default_upscale_factor: 2

data:
  root_local: "./data"
  root_drive: "/content/drive/MyDrive/ForensicAI_Lab/data"
  use_drive_if_available: true
  images_dir: "images"
  masks_dir: "masks"
  labels_csv: "labels.csv"
  synthetic_dir: "synthetic_data"
  feedback_dir: "feedback_data"
  datasets_registry:
    - name: "CASIA2.0"
      type: "image"
      local_subdir: "casia2"
    - name: "CoMoFoD"
      type: "image"
      local_subdir: "comofod"
    - name: "Coverage"
      type: "image"
      local_subdir: "coverage"
    - name: "IMD2020"
      type: "image"
      local_subdir: "imd2020"
    - name: "FaceForensics++_images"
      type: "image"
      local_subdir: "ffpp_images"
    - name: "DFDC_subset"
      type: "video"
      local_subdir: "dfdc_subset"
    - name: "FaceForensics++_videos"
      type: "video"
      local_subdir: "ffpp_videos"
    - name: "DeepDetect-2025"
      type: "image"
      local_subdir: "deepdetect2025"
    - name: "DeepfakeArt_inpainting"
      type: "image"
      local_subdir: "deepfakeart"
    - name: "AI-ArtBench"
      type: "image"
      local_subdir: "ai_artbench"

feedback:
  log_csv: "data/feedback_data/feedback_log.csv"
  images_dir: "data/feedback_data/images"
  retrain_manifest: "data/labels.csv"

logging:
  level: "INFO"
